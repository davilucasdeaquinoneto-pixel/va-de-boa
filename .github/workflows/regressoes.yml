name: Regressões da publicação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  navegador:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Gerar e verificar o pacote público
        run: |
          /usr/bin/python3 scripts/build.py
          /usr/bin/python3 -m unittest discover -s tests -v
      - name: Preparar as dependências de teste
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-selenium python3-yaml
      - name: Testar a interface com os cabeçalhos do Render
        run: /usr/bin/python3 tests/navegador.py
